name: Architecture and Contract Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development contract validator
        run: python -m pip install -r requirements-architecture.txt
      - name: Validate schemas and positive baselines
        run: python scripts/validate_contracts.py
      - name: Run positive and negative contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate documentation and traceability
        run: python scripts/validate_architecture.py
